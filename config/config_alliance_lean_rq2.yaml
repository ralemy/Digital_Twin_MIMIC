# =============================================================================
# LEAN SCOPE, RQ2 WITH THE CRITIC BEFORE POST-PROCESSING — config_alliance_lean.yaml
# with critic_agent.stage: raw. Run with:
#   bash jobs/run_all.sh lean --config config/config_alliance_lean_rq2.yaml --run-name <run>
#
# In tri_lean_exp3.4 the critic reviewed the post-processed forecast, which
# the level anchor and damping keep close to the observed values: it found
# 0 implausible values in every condition, so RQ2 measured nothing. Here it
# reviews the LLM's own output instead. Same cohort and split as
# tri_lean_exp3.4 (random_seed 42), and its tuned prompt settings, fixed
# below, so its full_pipeline@llama3_70b (critic after post-processing) is a
# fourth arm, paired by stay_id. Only the RQ2 conditions run.
#
# The model is Llama-3-70B, not Med42: in tri_lean_exp3.4's forecasts before
# post-processing (src/raw_violations.py), Med42's were all plausible (0 of
# 450 test patients; 1 of 322 calibration patients), so a critic has nothing
# to fix. Llama-3-70B, Med42's base model, tied it for accuracy (0.1096 vs
# 0.1095) and had the most violations of any pipeline: 53 of 450 test
# patients, 0.56 % of values, all below the range, mostly lactate.
#
# Everything else is config_alliance_lean.yaml; keep the two in step. Its
# header (approvals, CPU/RAM, Ollama) applies here too.
# =============================================================================
paths:
  # mimic-iv is the repo's symlink to $DT_MIMIC_DIR; $DT_RESULTS_DIR is where
  # results are recorded. Both come from your profile (paths.mimic_dir,
  # paths.results_dir), via jobs/setup_bash.sh — change them there, not
  # here. Keep results on project space, not scratch (purged after 60 days
  # of inactivity) — except where compute nodes can't write project space
  # (Trillium): there they go on scratch, copied to project space when done.
  mimic_root: "mimic-iv"
  work_dir: "$DT_RESULTS_DIR/mimic-iv-twin-work"
  cache_dir: "$DT_RESULTS_DIR/mimic-iv-twin-work/cache"
  results_dir: "$DT_RESULTS_DIR/mimic-iv-twin-work/results"

performance:
  # The GPU jobs request --cpus-per-task=12; 10 DuckDB threads leave 2 of
  # them for Python and Slurm/OS overhead.
  duckdb_threads: 10
  duckdb_memory_limit_gb: 120      # leaves ~80 GB of step 2's 192000M Slurm allocation for pandas/Python; DuckDB spills to $SLURM_TMPDIR past this
  llm_max_concurrent_requests: 8   # requests the pipeline sends at once; the GPU jobs also start Ollama with OLLAMA_NUM_PARALLEL = this (jobs/ollama_lib.sh). 8 + flash attention: 1.69x the speed of 4 without, same fallbacks/sMAPE (benchmark job 23198298)
  ollama_flash_attention: true     # OLLAMA_FLASH_ATTENTION for the jobs' Ollama server (benchmarked in job 23198298)
  batch_predict_baselines: true
  # run_experiment.py checkpoints each condition every this many test
  # patients, so a run stopped by the Slurm time limit loses at most one
  # batch when resubmitted. Smaller = less lost work, more small files.
  # The step 3 log prints the time per batch for LLM conditions — use it to
  # size this and the job's --time.
  checkpoint_batch_size: 32

cohort:
  min_age_years: 18
  min_icu_stay_hours: 48
  first_stay_only: true
  min_panel_coverage: 0.5
  observation_window_hours: 24
  forecast_horizon_hours: 24
  resample_freq_minutes: 60
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42
  max_patients: 3000               # set to null once timed

# Each variable may also set valid_range: [lo, hi] — raw values outside it
# are charting artefacts and are dropped at extraction and when the tensors
# are built (MAP 79104, SpO2 10099, heart rate 0 were in the Trillium lean
# panel). Default: the variable's plausible_range.
variables:
  - name: heart_rate
    source: icu_chartevents
    label_patterns: ["Heart Rate"]
    exclude_patterns: ["Alarm"]                 # drops "Heart rate Alarm - High/Low" (alarm thresholds, not measurements)
    plausible_range: [20, 250]
    unit: "bpm"
  - name: resp_rate
    source: icu_chartevents
    label_patterns: ["Respiratory Rate"]
    exclude_patterns: ["Set", "Spontaneous", "Total"]
    plausible_range: [4, 60]
    unit: "breaths/min"
  - name: spo2
    source: icu_chartevents
    label_patterns: ["O2 saturation pulseoxymetry", "SpO2"]
    exclude_patterns: ["Alarm", "Limit", "Sensor"]   # drops SpO2 alarm thresholds, "SpO2 Desat Limit", sensor-placement checkbox
    plausible_range: [50, 100]
    hard_range: [0, 100]                        # physically possible; every LLM forecast is clipped to it
    unit: "%"
  - name: map
    source: icu_chartevents
    label_patterns: ["Arterial Blood Pressure mean", "Non Invasive Blood Pressure mean", "ART BP Mean"]
    plausible_range: [20, 180]
    unit: "mmHg"
  - name: lactate
    source: hosp_labevents
    label_patterns: ["Lactate"]
    exclude_patterns: ["Dehydrogenase"]         # "Lactate" also matches lactate dehydrogenase (LDH), a different test
    fluids: ["Blood"]
    plausible_range: [0.1, 30]
    unit: "mmol/L"

deterioration_labels:
  vasopressor_itemid_labels: ["Norepinephrine", "Epinephrine", "Vasopressin", "Phenylephrine", "Dopamine"]
  lookahead_hours: 24

llm:
  backend: "ollama"
  ollama_host: "http://127.0.0.1:11434"
  # Primary model since tri_lean_exp2: M42 Health's Llama3-Med42-70B
  # (Med42-v2, clinical fine-tune of Llama 3 70B), community GGUF conversion;
  # fits fully onto one H100. Its full pipeline was the most accurate LLM
  # condition there; Qwen2.5-32B, the primary of the first two runs, is now
  # the qwen2_5_32b variant.
  model: "hf.co/mradermacher/Llama3-Med42-70B-GGUF:Q4_K_M"   # ~42.5GB
  alias: "med42:70b"                       # optional short name for the model, used in results and pre-flight checks
  # Optional `alias`, here or in any variant: a short local name for `model`,
  # created once on a login node with `ollama cp <model> <alias>`. When set,
  # the pipeline calls Ollama by the alias (and the job's pre-flight check
  # looks for it in `ollama list`); results record it in the llm_model column.
  # `model` stays the tag to pull. A variant that sets its own `model` does
  # not inherit the alias above.
  # alias: "med42:70b"
  temperature: 0.2
  max_tokens: 2048   # JSON for 5 variables x 24 h is ~700-900 tokens (Qwen tokenizes numbers digit by digit); 600 truncated every forecast (job 23141406), 1536 still truncated 9 (jobs 23143356-23150606)
  request_timeout_s: 180
  num_ctx: 8192
  # Model comparison (docs/llm_selection.docx): three general/medical pairs,
  # each medical model a fine-tune of its general partner.
  #   ~32B, Q8_0:   qwen2_5_32b / baichuan_m2
  #   ~27B, Q4_K_M: gemma3 / medgemma
  #   ~70B, Q4_K_M: llama3_70b / Med42-70B (llm.model above, primary)
  # A variant is used by appending '@<name>' to an LLM condition in
  # `conditions` (e.g. full_pipeline@medgemma); it inherits every llm key
  # above and overrides only what it lists. A variant may set
  # `critic_variant: <other variant>` to give the critic agent that variant's
  # model instead of its own (see medgemma_gemma3_critic). Download them all
  # with: bash jobs/submit.sh jobs/prep2_download_models.sh <this config>
  variants:
    baichuan_m2:
      # Baichuan-M2-32B: medical fine-tune of Qwen2.5-32B (Apache 2.0, not
      # gated). Q8_0 to match Qwen2.5-32B's quantization. A reasoning
      # model: with Ollama's default it reasoned past max_tokens on every
      # forecast, leaving the answer empty (probe jobs 1033722, 1034050);
      # think: false turns the reasoning off and it answers in ~800 tokens.
      model: "hf.co/bartowski/baichuan-inc_Baichuan-M2-32B-GGUF:Q8_0"   # ~35GB
      alias: "baichuan-m2:32b"
      think: false
    gemma3:
      model: "gemma3:27b"                                       # Q4_K_M, ~17GB
    medgemma:
      # MedGemma 27B text (v1): medical fine-tune of Gemma 3 27B. Use is
      # governed by Google's Health AI Developer Foundations terms.
      model: "hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M"   # ~17GB
      alias: "medgemma:27b"
    medgemma_gemma3_critic:
      # MedGemma forecasts, Gemma 3 corrects implausible values: does a
      # different critic model help? (Compared in evaluation.extra_comparisons.)
      model: "hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M"
      alias: "medgemma:27b"
      critic_variant: gemma3
    llama3_70b:
      # Llama 3 70B Instruct: Med42's base model (Meta Llama 3 Community Licence).
      model: "llama3:70b-instruct-q4_K_M"                       # ~43GB
    qwen2_5_32b:
      # Qwen2.5-32B Instruct, Baichuan-M2's base model; the primary model of
      # the first two Trillium runs.
      model: "qwen2.5:32b-instruct-q8_0"                        # ~34GB
      alias: "qwen2.5:32b"

# Forecasting prompt and output (src/forecasting_agent.py). trend_hint and
# cohort_anchor are tuned by src/tune.py (config/tuning_grid.yaml) from their
# defaults (slope, false).
forecasting_agent:
  # Post-processing (pipeline.py, after the LLM, before the critic): the
  # forecast's hour 1 moved a share level_anchor_weight of the way to the mean
  # of the last level_window_hours observed hours, then each hour's change
  # from hour 1 times drift_damping. With fit_postprocess, calibrate.py fits
  # both per condition on the calibration patients from the saved forecasts
  # (no extra LLM calls) and run_experiment.py applies the fitted values; the
  # values here are the starting point, used by tune.py.
  # tri_lean_exp2: tuning chose drift_damping 0.25 (0.5 and 0 within 0.002).
  drift_damping: 0.25
  level_anchor_weight: 0.0
  level_window_hours: 6
  fit_postprocess: true
  # Interval half-widths the model gives: endpoints = one at the first and
  # one at the last hour, interpolated, so intervals can widen with lead time
  # for ~10 more output numbers; per_hour = all 24 per variable (about 60%
  # more output tokens, so longer jobs); constant = one number per variable
  # (the original prompt; its 90% intervals covered 16-39% on Trillium).
  interval: endpoints
  # Fixed at tri_lean_exp3.4's tuned values (tuning_grid below has no rounds).
  similarity_context: trajectory
  trend_hint: none

similarity_agent:
  k_neighbors: 30
  feature_hours: 24

critic_agent:
  enabled: true
  max_correction_attempts: 1
  # The critic reviews the LLM's own forecast, before the level anchor and
  # damping (critic_agent.critic_review_stage). After them, as in
  # tri_lean_exp3.4, it found nothing to fix in any condition.
  stage: raw

baselines:
  run_naive: true
  run_gbm: false                   # not needed for RQ2
  run_lstm: false
  run_single_model_llm: false      # no Med42 condition: don't load it
  lstm_hidden_size: 128
  lstm_epochs: 200
  lstm_checkpoint_every_epochs: 20   # LSTM training checkpoint interval (resume after a stop)

conditions:
  - naive
  # RQ2 with Llama-3-70B: LLM critic vs none vs clipping.
  - full_pipeline@llama3_70b
  - full_pipeline_no_critic@llama3_70b
  - full_pipeline_clip_critic@llama3_70b

# Ensembles (pipeline.ensembles): the mean of the members' forecasts and
# interval half-widths, built after the members at no GPU cost.
# tri_lean_exp2: Med42's full pipeline averaged with the LSTM beat the LSTM
# alone (per-patient sMAPE 0.1075 vs 0.1094, p = 0.0008).
ensembles: []

evaluation:
  bootstrap_resamples: 2000
  bootstrap_alpha: 0.05
  interval_width_pct: 90
  # Models whose RQ1-RQ3 analysis is reported: "primary" (llm.model, the
  # pre-specified analysis) plus any LLM variant chosen on validation data
  # by src/select_rq_model.py (it adds the variant here with --write-config,
  # together with the conditions RQ2 needs, e.g. full_pipeline_no_critic@<v>).
  rq_models: [llama3_70b]            # RQ2 under RQ_model@llama3_70b (RQ1 is skipped: no single model)
  # Extra paired comparisons [A, B] (A - B per-patient sMAPE, as for the
  # RQs) in statistical_analysis.json under extra_comparisons.
  extra_comparisons:
    # Does the LLM critic beat clipping? (RQ2 itself, LLM critic vs none,
    # is in statistical_analysis.json under RQ2_*.)
    - [full_pipeline_clip_critic@llama3_70b, full_pipeline@llama3_70b]
    - [full_pipeline_clip_critic@llama3_70b, full_pipeline_no_critic@llama3_70b]

logging:
  # Live aggregate metrics on Weights & Biases (src/tracking.py): progress,
  # rates, per-condition metrics, tuning scores, and the job's CPU/GPU
  # usage. Never log lines, model output or per-patient values; errors are
  # sent only as a type ("malformed forecast - see logs for details").
  # One-time setup on a login node: `wandb login`. Without it, or with
  # enabled: false, runs proceed without tracking.
  wandb:
    enabled: true
    project: mimic-iv-digital-twin
    entity: null      # your default W&B account
    mode: online      # offline: write locally, `wandb sync` later

# No tuning: the settings above are fixed. This grid has no rounds, so the
# tune stage only writes the tuned config (with the same tuning/calibration
# split as the standard grid).
tuning_grid: config/tuning_grid_none.yaml

# jobs/run_all.sh: work estimates (minutes) for 3 Llama-3-70B conditions
# (55-58 min each on Trillium's H100s; more allowed here for Nibi).
run_all:
  estimates_min: {tune: 30, calibrate: 200, run: 260}
