# =============================================================================
# Personal profile for the jobs in jobs/ — a SAMPLE. It holds only your
# PhysioNet credentials, which only jobs/prep1_download_mimic_nibi.sh uses.
# Paths (repo, MIMIC-IV, Ollama models, modules) are NOT set here: they come
# from jobs/setup_bash.sh, per cluster.
#
# Set up once (only if you will download MIMIC-IV with prep1):
#   cp config/profile.sample.yml ~/.config/dt_profile.yml
#   chmod 600 ~/.config/dt_profile.yml      # it holds your PhysioNet password
#   # then edit ~/.config/dt_profile.yml
#
# Jobs read ~/.config/dt_profile.yml by default; to use another file, pass
# --profile <file> among the job's arguments:
#   sbatch jobs/prep1_download_mimic_nibi.sh --profile ~/.config/other.yml
#
# Keep your copy private: never commit it, never put it in the repo or in
# /project (shared with the group). Jobs refuse a profile that holds a
# password but is readable by anyone else (fix with chmod 600).
# =============================================================================

# Your PhysioNet account must be credentialed for MIMIC-IV. The password
# never leaves this file except into a private, temporary wgetrc inside the
# download job.
physionet:
  username: ""
  password: ""
