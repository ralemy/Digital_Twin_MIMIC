# =============================================================================
# YOUR PROFILE — a TEMPLATE. Copy it once per cluster (Alliance clusters don't
# share home directories), fill it in, and keep it private:
#
#   cp config/profile.sample.yml ~/.config/dt_profile.yml
#   chmod 600 ~/.config/dt_profile.yml      # required: it holds your PhysioNet password
#   nano ~/.config/dt_profile.yml           # or any editor
#   bash jobs/setup_bash.sh                 # symlinks, Ollama, .venv, ~/.bashrc (README, section 2)
#   source ~/.bashrc
#
# This is the only file you edit to set the project up: jobs/setup_bash.sh
# reads it, sets every location (DT_MIMIC_DIR, DT_RESULTS_DIR, ...) and the
# Slurm account, creates the repo's mimic-iv and ollama-models symlinks,
# installs Ollama and writes the final values into ~/.bashrc. Nothing in
# jobs/, config/ or src/ needs changing. After changing this file, redo the
# setup: rm setup.lock && bash jobs/setup_bash.sh && source ~/.bashrc
#
# Paths must be absolute; ~ and environment variables ($HOME, $SCRATCH, $USER,
# and $DT_REPO — where this repo is cloned) are expanded when it is read.
#
# Keep your copy private: never commit it, never put it in the repo or in
# /project (shared with the group). Every job refuses a profile that others
# can read (fix with chmod 600). Jobs read ~/.config/dt_profile.yml; to use
# another file, pass --profile <file> among a job's arguments (or set
# DT_PROFILE=<file> before sourcing jobs/setup_bash.sh).
# =============================================================================

slurm:
  # Your allocation's account, e.g. def-yourpi. `sshare -U -u $USER` lists
  # yours; use the def-... one (GPU jobs are charged to its _gpu counterpart
  # automatically). Exported as SBATCH_ACCOUNT, so sbatch/salloc use it.
  account: ""

paths:
  # Where the MIMIC-IV files (hosp/, icu/) are downloaded — ~10 GB. Project
  # space is backed up and not purged; only credentialed people may be able to
  # read it (README, "Before you start", item 3). The repo's mimic-iv symlink
  # points here. Example: ~/projects/def-yourpi/mimic-iv/3.1
  mimic_dir: ""

  # Where results are recorded: <results_dir>/mimic-iv-twin-work (lean) and
  # <results_dir>/mimic-iv-twin-work-full (full). Same access rules as the
  # data. Example: ~/projects/def-yourpi/dt-results
  results_dir: ""

  # Where the Ollama models are downloaded — ~190 GB for all six. Scratch has
  # room but is purged after a period of inactivity (re-run prep2 if models
  # go missing). The repo's ollama-models symlink points here.
  # Example: $SCRATCH/ollama-local/models
  ollama_models: ""

  # Where Ollama is installed (no root needed; ~2 GB): the setup unpacks it
  # into the parent of this directory, which must end in /bin.
  ollama_bin: ~/ollama-local/bin

environment:
  # Modules every job loads before activating .venv. Leave empty for the
  # default on Alliance clusters, "StdEnv/2023 python/3.11". Adding
  # "gcc arrow/25.0.0" gives pandas pyarrow — not between runs of one
  # experiment: string columns then read as `str`, not `object`.
  modules: ""

  # The Ollama release the setup installs. Leave empty for 0.34.4, the
  # version this project was run with.
  ollama_version: ""

  # Weights & Biases sends aggregate metrics (no patient-level data) to an
  # external service. true (the default) keeps it off whatever the configs
  # say; set false only if your ethics approval and data governance allow it.
  disable_wandb: true

  # Whether this cluster's compute (worker) nodes can reach the internet:
  # true on Nibi, false on Rorqual (see the cluster's Alliance wiki page).
  # With false, the downloads (MIMIC-IV with prep1, the Ollama models with
  # prep2) run on a login node instead of as Slurm jobs — jobs/run_all.sh does
  # that by itself; run prep1/prep2 by hand with bash (README, section 4).
  workers_have_internet: true

physionet:
  # Your PhysioNet account, credentialed for MIMIC-IV — used only by
  # jobs/prep1_download_mimic_nibi.sh. The password never leaves this file
  # except into a private, temporary wgetrc inside the download job.
  username: ""
  password: ""
