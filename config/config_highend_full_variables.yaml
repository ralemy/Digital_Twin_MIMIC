# =============================================================================
# ALTERNATE SCOPE — NOT what has been described to UVic's HREB.
#
# Same high-end hardware sizing as config_highend.yaml (performance/llm/
# baselines sections below are identical), but a much larger physiological
# variable panel: 19 variables instead of 5. This is a genuine scope change,
# not a hardware one, and it is NOT covered by the application UVic's HREB
# has already reviewed:
#   - Chapter 5 (methods) states the panel is "five variables ... heart
#     rate, respiratory rate, peripheral oxygen saturation (SpO2), mean
#     arterial pressure (MAP), and serum lactate."
#   - The letter already sent to the Board (Letter_to_UVic_HREB.docx,
#     Appendix A) states in writing: "This matches the version of the
#     variable panel the Board is seeing, and will not change."
#   - The item_mapping.json the Board was told to expect (Section E.7 /
#     F.7 of the application) was scoped to five variables' worth of
#     itemids, not nineteen.
#
# Running this file produces results the current ethics approval does not
# cover. Per the user's own instruction (2026-09-28), no correspondence
# with the Board is being updated yet — this file exists so the code is
# ready if/when that revision is made, not as permission to run it before
# then. Do not run this against real MIMIC-IV data ahead of an amendment
# being submitted and approved; config_highend.yaml (the 5-variable file)
# remains the one that matches the current approval.
# =============================================================================

paths:
  mimic_root: "~/mimic-iv"
  work_dir: "~/mimic-iv-twin-work-full"    # separate from config_highend.yaml's work_dir so the
  cache_dir: "~/mimic-iv-twin-work-full/cache"   # two scopes never overwrite each other's cached
  results_dir: "~/mimic-iv-twin-work-full/results"  # extractions or results on disk

performance:
  duckdb_threads: 20
  duckdb_memory_limit_gb: 300
  llm_max_concurrent_requests: 4           # see README — must match `OLLAMA_NUM_PARALLEL` when you start `ollama serve`
  batch_predict_baselines: true

cohort:
  min_age_years: 18
  min_icu_stay_hours: 48
  first_stay_only: true
  # 19 variables means a patient needs 50% coverage across a much larger
  # panel to be included — more of the cohort will fail this filter than
  # under the 5-variable panel, where broad availability was one of the
  # selection criteria (Section 5.3/5.4). Expect a visibly smaller eligible
  # cohort than config_highend.yaml even before max_patients is applied.
  min_panel_coverage: 0.5
  observation_window_hours: 24
  forecast_horizon_hours: 24
  resample_freq_minutes: 60
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42
  max_patients: 3000

# 19 variables: the original 5 (unchanged: same itemid label patterns,
# plausible ranges, and units already reviewed), plus 3 more routine vitals
# and 11 more labs — a reasonably standard "broad ICU state" panel similar
# in spirit to other MIMIC-based deterioration/forecasting work, not a
# panel drawn from this dissertation's own prior documents (no such list
# exists yet — this is a proposed expansion for the researcher to review,
# edit, and only then carry into a methods/ethics revision, not a verified
# final panel). Label patterns for the three added vitals (sbp, dbp,
# temperature) were checked directly against a real icu/d_items.csv; the
# 11 added labs use standard MIMIC-IV label text and will resolve the same
# pattern-matched way the original 5 do — review item_mapping.json after
# running src/resolve_items.py before trusting any of them, exactly as the
# README already instructs for the 5-variable panel.
variables:
  - name: heart_rate
    source: icu_chartevents
    label_patterns: ["Heart Rate"]
    exclude_patterns: ["Alarm"]                 # drops "Heart rate Alarm - High/Low" (alarm thresholds, not measurements)
    plausible_range: [20, 250]
    unit: "bpm"
  - name: resp_rate
    source: icu_chartevents
    label_patterns: ["Respiratory Rate"]
    exclude_patterns: ["Set", "Spontaneous", "Total"]
    plausible_range: [4, 60]
    unit: "breaths/min"
  - name: spo2
    source: icu_chartevents
    label_patterns: ["O2 saturation pulseoxymetry", "SpO2"]
    exclude_patterns: ["Alarm", "Limit", "Sensor"]   # drops SpO2 alarm thresholds, "SpO2 Desat Limit", sensor-placement checkbox
    plausible_range: [50, 100]
    unit: "%"
  - name: map
    source: icu_chartevents
    label_patterns: ["Arterial Blood Pressure mean", "Non Invasive Blood Pressure mean", "ART BP Mean"]
    plausible_range: [20, 180]
    unit: "mmHg"
  - name: lactate
    source: hosp_labevents
    label_patterns: ["Lactate"]
    exclude_patterns: ["Dehydrogenase"]         # "Lactate" also matches lactate dehydrogenase (LDH), a different test
    fluids: ["Blood"]
    plausible_range: [0.1, 30]
    unit: "mmol/L"
  # --- added vitals (icu/chartevents) ---
  - name: sbp
    source: icu_chartevents
    label_patterns: ["Non Invasive Blood Pressure systolic", "Arterial Blood Pressure systolic", "ART BP Systolic"]
    plausible_range: [40, 250]
    unit: "mmHg"
  - name: dbp
    source: icu_chartevents
    label_patterns: ["Non Invasive Blood Pressure diastolic", "Arterial Blood Pressure diastolic", "ART BP Diastolic"]
    plausible_range: [20, 150]
    unit: "mmHg"
  - name: temperature
    source: icu_chartevents
    label_patterns: ["Temperature Fahrenheit"]
    plausible_range: [86, 110]
    unit: "°F"
  # --- added labs (hosp/labevents) ---
  - name: creatinine
    source: hosp_labevents
    label_patterns: ["Creatinine"]
    fluids: ["Blood"]
    plausible_range: [0.1, 20]
    unit: "mg/dL"
  - name: bun
    source: hosp_labevents
    label_patterns: ["Urea Nitrogen"]
    fluids: ["Blood"]
    plausible_range: [1, 200]
    unit: "mg/dL"
  - name: sodium
    source: hosp_labevents
    label_patterns: ["Sodium"]
    fluids: ["Blood"]
    plausible_range: [100, 180]
    unit: "mEq/L"
  - name: potassium
    source: hosp_labevents
    label_patterns: ["Potassium"]
    fluids: ["Blood"]
    plausible_range: [1.5, 9]
    unit: "mEq/L"
  - name: wbc
    source: hosp_labevents
    label_patterns: ["White Blood Cells"]
    plausible_range: [0.1, 100]
    unit: "K/uL"
  - name: platelet
    source: hosp_labevents
    label_patterns: ["Platelet Count"]
    plausible_range: [1, 1200]
    unit: "K/uL"
  - name: hemoglobin
    source: hosp_labevents
    label_patterns: ["Hemoglobin"]
    match: exact                               # substring match picks up Carboxy-/Met-hemoglobin, Hb A1c, fetal Hb, ...
    fluids: ["Blood"]
    plausible_range: [2, 22]
    unit: "g/dL"
  - name: bicarbonate
    source: hosp_labevents
    label_patterns: ["Bicarbonate"]
    fluids: ["Blood"]
    plausible_range: [5, 50]
    unit: "mEq/L"
  - name: glucose
    source: hosp_labevents
    label_patterns: ["Glucose"]
    fluids: ["Blood"]
    plausible_range: [10, 1000]
    unit: "mg/dL"
  - name: bilirubin_total
    source: hosp_labevents
    label_patterns: ["Bilirubin, Total"]
    fluids: ["Blood"]
    plausible_range: [0.1, 50]
    unit: "mg/dL"
  - name: ph
    source: hosp_labevents
    label_patterns: ["pH"]
    match: exact                               # "pH" as a substring matches ~130 labels (Phosphate, Lymphocytes, ...)
    fluids: ["Blood"]
    plausible_range: [6.8, 7.8]
    unit: ""

deterioration_labels:
  vasopressor_itemid_labels: ["Norepinephrine", "Epinephrine", "Vasopressin", "Phenylephrine", "Dopamine"]
  lookahead_hours: 24

llm:
  backend: "ollama"
  ollama_host: "http://127.0.0.1:11434"
  model: "qwen2.5:32b-instruct-q8_0"
  temperature: 0.2
  # 19 variables means a much longer required JSON output (forecast +
  # interval_halfwidth per variable per hour) than the 5-variable panel —
  # raised well above config_highend.yaml's 600 so generation isn't
  # truncated mid-JSON. Watch the first few real runs for truncation
  # (forecasting_agent.py's _validate_shape() falls back to naive on any
  # parse/shape failure, so a truncation shows up as silently-degraded
  # accuracy, not a crash) and raise further if needed.
  max_tokens: 4096   # JSON for 19 variables x 24 h is ~2,500-3,500 tokens; 1800 would truncate every forecast
  request_timeout_s: 240
  # A 19-variable prompt (per-hour summaries + similarity-cohort context)
  # is meaningfully longer than the 5-variable version — raised from 8192
  # to keep headroom. Recheck actual prompt token counts on your data
  # before a full run; num_ctx too small silently truncates the prompt
  # itself, not just the output.
  num_ctx: 12288

similarity_agent:
  k_neighbors: 30
  feature_hours: 24

critic_agent:
  enabled: true
  # 19 variables means up to 19x more plausible-range checks per forecast
  # than the 5-variable panel, so more correction calls should be expected
  # on average — this is expected, not a bug, and is itself a useful RQ2
  # data point if you run both configs and compare correction frequency.
  max_correction_attempts: 1

baselines:
  run_naive: true
  run_gbm: true
  run_lstm: true
  run_single_model_llm: true
  lstm_hidden_size: 128
  lstm_epochs: 200

conditions:
  - naive
  - gbm
  - lstm
  - single_model_llm
  - full_pipeline
  - full_pipeline_no_critic
  - full_pipeline_no_similarity

evaluation:
  bootstrap_resamples: 2000
  bootstrap_alpha: 0.05
  interval_width_pct: 90
