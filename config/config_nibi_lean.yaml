# =============================================================================
# Same 5-variable panel as config.yaml / config_highend.yaml — the version
# already described to UVic's HREB — sized to run as a Slurm batch job on
# Nibi (Digital Research Alliance of Canada), one H100 80GB GPU allocation,
# instead of on a local machine. Paired with jobs/run_lean_nibi.sh.
#
# Differences from config_highend.yaml are ONLY: paths (use $PROJECT/$SCRATCH,
# which only exist inside an Alliance job/login environment — this file will
# NOT load correctly outside one) and performance.duckdb_threads /
# llm_max_concurrent_requests (capped to Nibi's documented "no more than 14
# CPU cores per GPU" guideline, not the 24-core local machine's number).
# Nothing about the model, cohort criteria, variable panel, or conditions
# differs from config_highend.yaml — this is the same experiment, same
# scope already represented to the Board, on different infrastructure.
#
# IMPORTANT — read before submitting a job with this file:
#   1. MIMIC-IV DUA / data custody: confirm that Nibi's storage meets
#      PhysioNet's Data Use Agreement requirements for where credentialed
#      data may be stored before uploading anything here. This file assumes
#      that's been checked; it isn't this file's job to check it for you.
#   2. The CPU/GPU/RAM numbers below (cpus-per-task, mem, duckdb_threads)
#      are conservative starting points based on Nibi's public "no more
#      than 14 CPU cores per GPU" guidance, not a confirmed per-node spec
#      sheet (Nibi's own wiki page was not reachable while preparing this
#      file). Check `sinfo -o "%N %c %m %G"` on Nibi once you have an
#      account session, and raise these if a full node's worth is actually
#      available to a single-GPU job.
#   3. Ollama itself must already be running on 127.0.0.1:11434 before the
#      Python steps run — jobs/run_lean_nibi.sh starts it. This config does
#      not start Ollama; it only talks to it.
# =============================================================================

paths:
  # $PROJECT persists (unlike $SCRATCH, purged after 60 days of inactivity)
  # — appropriate for MIMIC-IV itself and for results you need to keep for
  # the dissertation. Update mimic_root if you placed the data somewhere
  # else under your project space.
  mimic_root: "$PROJECT/mimic-iv"
  work_dir: "$PROJECT/mimic-iv-twin-work"
  cache_dir: "$PROJECT/mimic-iv-twin-work/cache"
  results_dir: "$PROJECT/mimic-iv-twin-work/results"

performance:
  # Nibi's own guidance is "no more than 14 CPU cores" per GPU requested —
  # jobs/run_lean_nibi.sh requests --cpus-per-task=12, leaving 2 cores of
  # headroom under that ceiling for Slurm/OS overhead rather than requesting
  # right up against the documented limit.
  duckdb_threads: 10
  duckdb_memory_limit_gb: 120      # leaves ~80 GB of step 2's 192000M Slurm allocation for pandas/Python; DuckDB spills to $SLURM_TMPDIR past this
  llm_max_concurrent_requests: 4   # must match OLLAMA_NUM_PARALLEL in jobs/run_lean_nibi.sh
  batch_predict_baselines: true
  # run_experiment.py checkpoints each condition every this many test
  # patients, so a run stopped by the Slurm time limit loses at most one
  # batch when resubmitted. Smaller = less lost work, more small files.
  # The step 3 log prints the time per batch for LLM conditions — use it to
  # size this and the job's --time.
  checkpoint_batch_size: 32

cohort:
  min_age_years: 18
  min_icu_stay_hours: 48
  first_stay_only: true
  min_panel_coverage: 0.5
  observation_window_hours: 24
  forecast_horizon_hours: 24
  resample_freq_minutes: 60
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42
  max_patients: 3000               # same starting point as config_highend.yaml; set to null once timed

variables:
  - name: heart_rate
    source: icu_chartevents
    label_patterns: ["Heart Rate"]
    exclude_patterns: ["Alarm"]                 # drops "Heart rate Alarm - High/Low" (alarm thresholds, not measurements)
    plausible_range: [20, 250]
    unit: "bpm"
  - name: resp_rate
    source: icu_chartevents
    label_patterns: ["Respiratory Rate"]
    exclude_patterns: ["Set", "Spontaneous", "Total"]
    plausible_range: [4, 60]
    unit: "breaths/min"
  - name: spo2
    source: icu_chartevents
    label_patterns: ["O2 saturation pulseoxymetry", "SpO2"]
    exclude_patterns: ["Alarm", "Limit", "Sensor"]   # drops SpO2 alarm thresholds, "SpO2 Desat Limit", sensor-placement checkbox
    plausible_range: [50, 100]
    unit: "%"
  - name: map
    source: icu_chartevents
    label_patterns: ["Arterial Blood Pressure mean", "Non Invasive Blood Pressure mean", "ART BP Mean"]
    plausible_range: [20, 180]
    unit: "mmHg"
  - name: lactate
    source: hosp_labevents
    label_patterns: ["Lactate"]
    exclude_patterns: ["Dehydrogenase"]         # "Lactate" also matches lactate dehydrogenase (LDH), a different test
    fluids: ["Blood"]
    plausible_range: [0.1, 30]
    unit: "mmol/L"

deterioration_labels:
  vasopressor_itemid_labels: ["Norepinephrine", "Epinephrine", "Vasopressin", "Phenylephrine", "Dopamine"]
  lookahead_hours: 24

llm:
  backend: "ollama"
  ollama_host: "http://127.0.0.1:11434"
  model: "qwen2.5:32b-instruct-q8_0"   # ~34GB weights — comfortable on an 80GB H100, same model as config_highend.yaml
  alias: "qwen2.5:32b"                     # optional short name for the model, used in results and pre-flight checks
  # Optional `alias`, here or in any variant: a short local name for `model`,
  # created once on a login node with `ollama cp <model> <alias>`. When set,
  # the pipeline calls Ollama by the alias (and the job's pre-flight check
  # looks for it in `ollama list`); results record it in the llm_model column.
  # `model` stays the tag to pull. A variant that sets its own `model` does
  # not inherit the alias above.
  # alias: "qwen2.5:32b"
  temperature: 0.2
  max_tokens: 1536   # JSON for 5 variables x 24 h is ~700-900 tokens (Qwen tokenizes numbers digit by digit); 600 truncated every forecast (job 23141406)
  request_timeout_s: 180
  num_ctx: 8192
  # Alternative models for the exploratory model comparison. A variant is
  # used by appending '@<name>' to an LLM condition in `conditions` below
  # (e.g. full_pipeline@medgemma); it inherits every llm key above and
  # overrides only what it lists. Variants not named in `conditions` are
  # ignored, so these definitions are harmless until you enable them.
  # Pull each model on a login node first (see jobs/step3_run_experiment_nibi.sh).
  # gemma3 is medgemma's general-purpose base model at the same quantization,
  # so gemma3 vs medgemma isolates the effect of medical training.
  variants:
    gemma3:
      model: "gemma3:27b"                                       # Q4_K_M, ~17GB
    medgemma:
      # Google's MedGemma 27B text model is gated on Hugging Face (accept the
      # Health AI Developer Foundations terms first). VERIFY this tag pulls
      # before enabling: `ollama pull hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M`
      model: "hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M"   # ~17GB
      alias: "medgemma:27b"
    llama_Med42_70b:
      # M42 Health's Llama3-Med42-70B (clinical fine-tune of Llama 3 70B),
      # community GGUF conversion. Set up once on a login node:
      #   ollama pull hf.co/mradermacher/Llama3-Med42-70B-GGUF:Q4_K_M
      #   ollama cp hf.co/mradermacher/Llama3-Med42-70B-GGUF:Q4_K_M med42:70b
      # jobs/prep3_med42_nibi.sh checks it loads fully onto one H100.
      model: "hf.co/mradermacher/Llama3-Med42-70B-GGUF:Q4_K_M"   # ~42.5GB
      alias: "med42:70b"

similarity_agent:
  k_neighbors: 30
  feature_hours: 24

critic_agent:
  enabled: true
  max_correction_attempts: 1

baselines:
  run_naive: true
  run_gbm: true
  run_lstm: true
  run_single_model_llm: true
  lstm_hidden_size: 128
  lstm_epochs: 200
  lstm_checkpoint_every_epochs: 20   # LSTM training checkpoint interval (resume after a stop)

conditions:
  - naive
  - gbm
  - lstm
  - single_model_llm
  - full_pipeline
  - full_pipeline_no_critic
  - full_pipeline_no_similarity
  # Exploratory model comparison (see llm.variants). Grouped by model so
  # Ollama loads each model once. Each line adds a full pass over the test
  # split, so check the step 3 --time limit before enabling.
  - single_model_llm@gemma3
  - full_pipeline@gemma3
  - single_model_llm@medgemma
  - full_pipeline@medgemma
  - single_model_llm@llama_Med42_70b
  - full_pipeline@llama_Med42_70b

evaluation:
  bootstrap_resamples: 2000
  bootstrap_alpha: 0.05
  interval_width_pct: 90
