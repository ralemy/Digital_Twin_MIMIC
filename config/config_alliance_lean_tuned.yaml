# GENERATED by src/tune.py from config/config_alliance_lean.yaml and config/tuning_grid.yaml — do not edit by hand;
# re-run tuning instead. Identical to the base config except for the overrides
# listed under tuned_from, and results_dir / checkpoint_dir, which point to
# separate *_tuned locations so the untuned run's outputs are kept.
paths:
  mimic_root: mimic-iv
  work_dir: $DT_RESULTS_DIR/mimic-iv-twin-work
  cache_dir: $DT_RESULTS_DIR/mimic-iv-twin-work/cache
  results_dir: $DT_RESULTS_DIR/mimic-iv-twin-work/results_tuned
  checkpoint_dir: $DT_RESULTS_DIR/mimic-iv-twin-work/checkpoints_tuned
performance:
  duckdb_threads: 10
  duckdb_memory_limit_gb: 120
  llm_max_concurrent_requests: 8
  ollama_flash_attention: true
  batch_predict_baselines: true
  checkpoint_batch_size: 32
cohort:
  min_age_years: 18
  min_icu_stay_hours: 48
  first_stay_only: true
  min_panel_coverage: 0.5
  observation_window_hours: 24
  forecast_horizon_hours: 24
  resample_freq_minutes: 60
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42
  max_patients: 3000
variables:
- name: heart_rate
  source: icu_chartevents
  label_patterns:
  - Heart Rate
  exclude_patterns:
  - Alarm
  plausible_range:
  - 20
  - 250
  unit: bpm
- name: resp_rate
  source: icu_chartevents
  label_patterns:
  - Respiratory Rate
  exclude_patterns:
  - Set
  - Spontaneous
  - Total
  plausible_range:
  - 4
  - 60
  unit: breaths/min
- name: spo2
  source: icu_chartevents
  label_patterns:
  - O2 saturation pulseoxymetry
  - SpO2
  exclude_patterns:
  - Alarm
  - Limit
  - Sensor
  plausible_range:
  - 50
  - 100
  unit: '%'
- name: map
  source: icu_chartevents
  label_patterns:
  - Arterial Blood Pressure mean
  - Non Invasive Blood Pressure mean
  - ART BP Mean
  plausible_range:
  - 20
  - 180
  unit: mmHg
- name: lactate
  source: hosp_labevents
  label_patterns:
  - Lactate
  exclude_patterns:
  - Dehydrogenase
  fluids:
  - Blood
  plausible_range:
  - 0.1
  - 30
  unit: mmol/L
deterioration_labels:
  vasopressor_itemid_labels:
  - Norepinephrine
  - Epinephrine
  - Vasopressin
  - Phenylephrine
  - Dopamine
  lookahead_hours: 24
llm:
  backend: ollama
  ollama_host: http://127.0.0.1:11434
  model: qwen2.5:32b-instruct-q8_0
  alias: qwen2.5:32b
  temperature: 0.2
  max_tokens: 2048
  request_timeout_s: 180
  num_ctx: 8192
  variants:
    baichuan_m2:
      model: hf.co/bartowski/baichuan-inc_Baichuan-M2-32B-GGUF:Q8_0
      alias: baichuan-m2:32b
      think: false
    gemma3:
      model: gemma3:27b
    medgemma:
      model: hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M
      alias: medgemma:27b
    medgemma_gemma3_critic:
      model: hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M
      alias: medgemma:27b
      critic_variant: gemma3
    llama3_70b:
      model: llama3:70b-instruct-q4_K_M
    llama_Med42_70b:
      model: hf.co/mradermacher/Llama3-Med42-70B-GGUF:Q4_K_M
      alias: med42:70b
similarity_agent:
  k_neighbors: 50
  feature_hours: 24
critic_agent:
  enabled: true
  max_correction_attempts: 1
baselines:
  run_naive: true
  run_gbm: true
  run_lstm: true
  run_single_model_llm: true
  lstm_hidden_size: 128
  lstm_epochs: 200
  lstm_checkpoint_every_epochs: 20
  lstm_seed: 42
conditions:
- naive
- gbm
- lstm
- single_model_llm
- full_pipeline
- full_pipeline_no_critic
- full_pipeline_no_similarity
- single_model_llm@baichuan_m2
- full_pipeline@baichuan_m2
- single_model_llm@gemma3
- full_pipeline@gemma3
- single_model_llm@medgemma
- full_pipeline@medgemma
- full_pipeline_clip_critic@medgemma
- full_pipeline@medgemma_gemma3_critic
- single_model_llm@llama3_70b
- full_pipeline@llama3_70b
- single_model_llm@llama_Med42_70b
- full_pipeline@llama_Med42_70b
evaluation:
  bootstrap_resamples: 2000
  bootstrap_alpha: 0.05
  interval_width_pct: 90
  rq_models:
  - primary
  extra_comparisons:
  - - full_pipeline_clip_critic@medgemma
    - full_pipeline@medgemma
  - - full_pipeline@medgemma_gemma3_critic
    - full_pipeline@medgemma
  - - full_pipeline@medgemma_gemma3_critic
    - full_pipeline_clip_critic@medgemma
  - - full_pipeline_clip_critic@medgemma
    - full_pipeline
  - - full_pipeline@medgemma_gemma3_critic
    - full_pipeline
logging:
  wandb:
    enabled: true
    project: mimic-iv-digital-twin
    entity: null
    mode: online
forecasting_agent:
  similarity_context: trajectory
tuned_from:
  config: config/config_alliance_lean.yaml
  grid: config/tuning_grid.yaml
  overrides:
    baselines.lstm_seed: 42
    forecasting_agent.similarity_context: trajectory
    similarity_agent.k_neighbors: 50
  n_tune_patients: 128
  seed: 42
