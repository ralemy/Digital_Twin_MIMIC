# =============================================================================
# Same experiment as config.yaml — same 5-variable panel, same cohort
# criteria, same conditions/ablations — sized for a bigger single machine
# (e.g. ~40GB GPU, ~400GB RAM, 24 CPU cores) instead of the original 11GB
# GTX 1080 Ti / 32GB RAM profile. Nothing about the *design* changes here:
# no new variables, no larger DT-GPT-style cohort, no cloud/API calls —
# just a bigger local LLM, a much larger (or full) local cohort, and
# parallel LLM calls, all still 100% local. See README.md, "Scaling up on
# better hardware" for what changed and why, and for the one thing this
# file deliberately does NOT change (the variable panel) and why that's
# a decision for the researcher, not an automatic hardware upgrade.
# =============================================================================

paths:
  mimic_root: "~/mimic-iv"
  work_dir: "~/mimic-iv-twin-work"
  cache_dir: "~/mimic-iv-twin-work/cache"
  results_dir: "~/mimic-iv-twin-work/results"

# New: lets src/common.py size DuckDB's thread pool / memory budget, and lets
# src/pipeline.py size the LLM thread pool and (optionally) batch the LSTM
# baseline onto the GPU. None of this changes what gets computed, only how
# many CPU threads / concurrent requests / GPU batch size are used to
# compute it. Tune these to your actual machine, not just copy these numbers
# — see the comments below and the README.
performance:
  duckdb_threads: 20                       # leave a few of your 24 cores free for the OS / Ollama
  duckdb_memory_limit_gb: 300              # generous headroom under 400GB total; DuckDB spills to disk past this
  llm_max_concurrent_requests: 4           # see README — must match `OLLAMA_NUM_PARALLEL` when you start `ollama serve`
  batch_predict_baselines: true            # batch the LSTM baseline's predict() across the whole test split on the GPU

cohort:
  min_age_years: 18
  min_icu_stay_hours: 48
  first_stay_only: true
  min_panel_coverage: 0.5
  observation_window_hours: 24
  forecast_horizon_hours: 24
  resample_freq_minutes: 60
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42
  # The 1080 Ti config subsampled to 300 patients mainly to keep sequential,
  # single-request LLM inference wall-clock time reasonable, not because
  # extraction or the baselines needed it. With duckdb_threads/memory above
  # and llm_max_concurrent_requests>1, the full eligible cohort is
  # realistic on this machine. Set to null to use every eligible patient;
  # start with a number (e.g. 3000) for your first full run so you can see
  # the wall-clock time before committing to the entire cohort.
  max_patients: 3000

# UNCHANGED from config.yaml — same 5-variable panel as the version already
# described to UVic's HREB (Chapter 5 / Appendix A, and the Appendix A data
# collection sheet in the letter to the Board). Expanding this list is a
# methods/scope decision, not a hardware one — the 1080 Ti was never the
# reason the panel was kept to five variables (see the proposal's Section
# 5.4 and the Cost chapter, which excludes the larger DT-GPT-style design
# because it requires cloud/managed-API access, not because of local
# hardware limits). If you decide you want more variables, that changes
# what's already been represented to the Board and should be a deliberate
# edit here, not a side effect of upgrading hardware.
variables:
  - name: heart_rate
    source: icu_chartevents
    label_patterns: ["Heart Rate"]
    exclude_patterns: ["Alarm"]                 # drops "Heart rate Alarm - High/Low" (alarm thresholds, not measurements)
    plausible_range: [20, 250]
    unit: "bpm"
  - name: resp_rate
    source: icu_chartevents
    label_patterns: ["Respiratory Rate"]
    exclude_patterns: ["Set", "Spontaneous", "Total"]
    plausible_range: [4, 60]
    unit: "breaths/min"
  - name: spo2
    source: icu_chartevents
    label_patterns: ["O2 saturation pulseoxymetry", "SpO2"]
    exclude_patterns: ["Alarm", "Limit", "Sensor"]   # drops SpO2 alarm thresholds, "SpO2 Desat Limit", sensor-placement checkbox
    plausible_range: [50, 100]
    unit: "%"
  - name: map
    source: icu_chartevents
    label_patterns: ["Arterial Blood Pressure mean", "Non Invasive Blood Pressure mean", "ART BP Mean"]
    plausible_range: [20, 180]
    unit: "mmHg"
  - name: lactate
    source: hosp_labevents
    label_patterns: ["Lactate"]
    exclude_patterns: ["Dehydrogenase"]         # "Lactate" also matches lactate dehydrogenase (LDH), a different test
    fluids: ["Blood"]
    plausible_range: [0.1, 30]
    unit: "mmol/L"

deterioration_labels:
  vasopressor_itemid_labels: ["Norepinephrine", "Epinephrine", "Vasopressin", "Phenylephrine", "Dopamine"]
  lookahead_hours: 24

llm:
  backend: "ollama"
  ollama_host: "http://127.0.0.1:11434"
  # A 40GB card comfortably fits a much stronger model than the 8B/q4 chosen
  # for an 11GB card. Two reasonable picks (pull whichever you use):
  #   ollama pull qwen2.5:32b-instruct-q8_0   # ~34GB weights, best quality/VRAM trade-off on 40GB
  #   ollama pull llama3.1:70b-instruct-q4_K_M # ~40GB weights, fits but leaves little headroom for
  #                                             # num_ctx / KV cache at concurrency > 1 — test before committing
  model: "qwen2.5:32b-instruct-q8_0"
  temperature: 0.2
  max_tokens: 1536   # JSON for 5 variables x 24 h is ~700-900 tokens (Qwen tokenizes numbers digit by digit); 600 truncated every forecast (job 23141406)
  request_timeout_s: 180           # a larger model is slower per call even though it's faster per token overall
  num_ctx: 8192                    # room for a longer similarity-context prompt (see similarity_agent.k_neighbors)

similarity_agent:
  k_neighbors: 30                  # larger cohort supports a larger neighbourhood without thinning it out
  feature_hours: 24

critic_agent:
  enabled: true
  max_correction_attempts: 1

baselines:
  run_naive: true
  run_gbm: true
  run_lstm: true
  run_single_model_llm: true
  lstm_hidden_size: 128            # more capacity now that training is cheap on this GPU (was 64)
  lstm_epochs: 200                 # was 30 in the 1080 Ti config; full-batch training of this size is still seconds here

conditions:
  - naive
  - gbm
  - lstm
  - single_model_llm
  - full_pipeline
  - full_pipeline_no_critic
  - full_pipeline_no_similarity

evaluation:
  bootstrap_resamples: 2000
  bootstrap_alpha: 0.05
  interval_width_pct: 90
